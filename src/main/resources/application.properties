spring.application.name=steamlite

# Lee las credenciales de Aiven desde un archivo .env en la raíz del proyecto (si existe).
# Ese archivo NO se sube a GitHub (está en .gitignore). Ver .env.example
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Incluye el mensaje de ResponseStatusException en el JSON de error (lo muestra el frontend)
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
